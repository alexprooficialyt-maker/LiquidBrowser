name: LiquidBrowser
options:
  bundleIdPrefix: com.liquidbrowser
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.liquidbrowser.app
    PRODUCT_NAME: LiquidBrowser
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    INFOPLIST_KEY_NSFaceIDUsageDescription: "SmartBot Browser usa Face ID para proteger tu privacidad."
    INFOPLIST_KEY_NSCameraUsageDescription: "Acceso a la cámara para escaneo de códigos QR."
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Permite exportar y guardar capturas completas de sitios web."

targets:
  LiquidBrowser:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: DesignSystem
      - path: Models
      - path: ViewModels
      - path: Views
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_NSFaceIDUsageDescription: "SmartBot Browser usa Face ID para proteger tu privacidad."
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: LiquidBrowser
        CFBundleDisplayName: "SmartBot Browser"
        CFBundleIdentifier: com.liquidbrowser.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSFaceIDUsageDescription: "SmartBot Browser usa Face ID para proteger tu privacidad."
        NSCameraUsageDescription: "Acceso a la cámara para escaneo de códigos QR."
        NSPhotoLibraryAddUsageDescription: "Permite exportar y guardar capturas completas de sitios web."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - liquidbrowser
              - http
              - https
