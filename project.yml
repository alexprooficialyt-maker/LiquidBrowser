name: LiquidBrowser
options:
  bundleIdPrefix: com.liquidbrowser
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.liquidbrowser.app
    PRODUCT_NAME: LiquidBrowser
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

targets:
  LiquidBrowser:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: DesignSystem
      - path: Models
      - path: ViewModels
      - path: Views
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: LiquidBrowser
        CFBundleDisplayName: "Liquid Browser"
        CFBundleIdentifier: com.liquidbrowser.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
