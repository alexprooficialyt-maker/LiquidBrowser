name: LiquidBrowser
options:
  bundleIdPrefix: com.liquidbrowser
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.liquidbrowser.app
    PRODUCT_NAME: LiquidBrowser
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"       # iPhone only
    ENABLE_BITCODE: NO
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    DEBUG_INFORMATION_FORMAT: dwarf
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

targets:
  LiquidBrowser:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LiquidBrowser
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: LiquidBrowser/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiquidBrowser/Resources/LiquidBrowser.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: LiquidBrowser/Resources/Info.plist
      properties:
        CFBundleName: LiquidBrowser
        CFBundleDisplayName: "Liquid Browser"
        CFBundleIdentifier: com.liquidbrowser.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
