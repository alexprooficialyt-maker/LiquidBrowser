workflows:
  ios-build:
    name: LiquidBrowser — Release IPA
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.liquidbrowser.app"
        APP_NAME: "LiquidBrowser"
        XCODE_PROJECT: "LiquidBrowser.xcodeproj"
        XCODE_SCHEME: "LiquidBrowser"

    scripts:
      - name: Setup Tools
        script: |
          brew install xcodegen

      - name: Generate Xcode Project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Build Unsigned App
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LiquidBrowser.app Payload/
          zip -r LiquidBrowser.ipa Payload
          rm -rf Payload

    artifacts:
      - LiquidBrowser.ipa
